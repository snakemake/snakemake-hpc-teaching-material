on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  repository-projects: read
  actions: read

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: GoogleCloudPlatform/release-please-action@v4
        id: release
        with:
          release-type: simple

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    name: Publish Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-yaml \
            texlive \
            texlive-fonts-extra \
            texlive-latex-extra \
            texlive-luatex \
            texlive-pictures \
            texlive-plain-generic \
            texlive-pstricks \
            texlive-science \
            latexmk \
            ghostscript \
            poppler-utils

      - name: Build Slides PDFs
        run: |
          ./render --master-tex Snakemake_HPC_Users.tex --configfile config/config_for_github.yaml --handout --sample-directory=_
          ./render --master-tex Snakemake_HPC_Creators.tex --configfile config/config_for_github.yaml --handout --sample-directory=_
          ./render --master-tex Snakemake_HPC_User_Creator_Combi.tex --configfile config/config_for_github.yaml --handout --sample-directory=_
          ./render --master-tex Snakemake_HPC_Admins.tex --configfile config/config_for_github.yaml --handout --sample-directory=_

      - name: Build Certificates PDF
        run: |
          cd certificates
          ./certificate_generator --exportfile participant_test.csv --textemplate template_english.tex --config config.yaml
          cd ..

      - name: Zip solutions and tutorial folders
        run: |
          cd setup_creators
          zip -r ../setup_creators_material.zip solutions tutorial
          cd ..

      - name: Create source bundle with PDFs
        run: |
          bundle_name="snakemake-hpc-teaching-material_${{ needs.release-please.outputs.tag_name }}_source_with_pdfs.zip"
          zip -r "$bundle_name" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "**/__pycache__/*"

      - name: Attach PDFs to Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          fail_on_unmatched_files: false
          files: |
            slides/*.pdf
            certificates/all_participants_certifications.pdf
            setup_creators_material.zip
            snakemake-hpc-teaching-material_${{ needs.release-please.outputs.tag_name }}_source_with_pdfs.zip
